name: Update GKD merged subscription

on:
  schedule:
    # 每天 3 次: UTC 1/7/13 = 北京时间 9:00 / 15:00 / 21:00
    # 源订阅更新时间不固定, 多跑几次保证规则新鲜度
    - cron: "0 1,7,13 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install json5 --no-save --no-audit --no-fund

      - name: Merge subscriptions
        run: node merge.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist sources
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update merged gkd subscription $(date +%F)"
            git push
          fi
